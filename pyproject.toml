[project]
name = "aisleopt"
version = "0.1.0"
description = "Retail decision models (range, promotion calendar, replenishment, markdown) on real grocery data plus a simulated twin with planted optimal answers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "pyomo>=6.7", "highspy>=1.7", "simpy>=4.1", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
aisleopt = "aisleopt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: runs the larger benchmark (about a minute)"]
